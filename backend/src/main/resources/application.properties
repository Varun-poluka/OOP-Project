spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/itsm
spring.datasource.username=itsm_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# JWT signing key: read from the JWT_SECRET environment variable, never stored in a file.
itsm.jwt.secret=${JWT_SECRET:}
itsm.jwt.lifetime-hours=8
# Browser origins that may call the API (the Vite dev server). Comma-separated.
itsm.cors.allowed-origins=http://localhost:5173
