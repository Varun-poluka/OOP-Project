# Used by tests annotated with @ActiveProfiles("test"); overrides application.properties.
# A separate database, rebuilt for each test run (create-drop), so tests never touch real data.
spring.datasource.url=jdbc:postgresql://localhost:5432/itsm_test
spring.datasource.username=itsm_user
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Fake signing key that only ever signs test tokens. The real key comes from JWT_SECRET.
itsm.jwt.secret=test-only-key-not-a-real-secret-0123456789
